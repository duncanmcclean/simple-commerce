name: GitHub Actions Security Analysis

on:
  push:
    branches:
      - 8.x
    paths:
      - '.github/**.yml'
      - '.github/**.yaml'
  pull_request:
    paths:
      - '.github/**.yml'
      - '.github/**.yaml'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    uses: duncanmcclean/.github/.github/workflows/zizmor.yaml@a7b7c24ac637a77cc5b4d1835ae3bccbd902ca48
    permissions: {}
