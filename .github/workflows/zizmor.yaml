name: GitHub Actions Security Analysis

on:
  push:
    branches:
      - 8.x
    paths:
      - '.github/**.yml'
      - '.github/**.yaml'
  pull_request:
    paths:
      - '.github/**.yml'
      - '.github/**.yaml'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    uses: duncanmcclean/.github/.github/workflows/zizmor.yaml@bcdd4b7632e98497b7d2e251aff2222d0b5a181d
    permissions: {}
