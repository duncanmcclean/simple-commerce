name: Zizmor

on:
  push:
    branches:
      - 8.x
    paths:
      - '.github/**.yml'
      - '.github/**.yaml'
  pull_request:
    paths:
      - '.github/**.yml'
      - '.github/**.yaml'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    uses: duncanmcclean/.github/.github/workflows/zizmor.yaml@3f08f281d0facb49b1a1f7ad5c94c58b3b2b61df
    permissions: {}
