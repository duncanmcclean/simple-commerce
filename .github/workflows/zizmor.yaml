name: GitHub Actions Security Analysis

on:
  push:
    branches:
      - 8.x
    paths:
      - '.github/**.yml'
      - '.github/**.yaml'
  pull_request:
    paths:
      - '.github/**.yml'
      - '.github/**.yaml'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    uses: duncanmcclean/.github/.github/workflows/zizmor.yaml@cf61113f3bcbc7fb40ab88d094d2be7b8a474f50 # v1.0.0
    permissions: {}
