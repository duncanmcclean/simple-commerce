name: GitHub Actions Security Analysis

on:
  push:
    branches:
      - 8.x
    paths:
      - '.github/**.yml'
      - '.github/**.yaml'
  pull_request:
    paths:
      - '.github/**.yml'
      - '.github/**.yaml'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    uses: duncanmcclean/.github/.github/workflows/zizmor.yaml@0711e4ce063444dd01bd24d4226cbf866e08d273 # v1.0.2
    permissions: {}
