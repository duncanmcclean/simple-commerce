name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, without the v prefix (e.g. 1.2.0)'
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: duncanmcclean/.github/.github/workflows/release.yaml@0711e4ce063444dd01bd24d4226cbf866e08d273 # v1.0.2
    permissions: {}
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    with:
      version: ${{ inputs.version }}
      assets: dist
