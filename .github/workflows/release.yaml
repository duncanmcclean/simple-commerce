name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, without the v prefix (e.g. 1.2.0)'
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: duncanmcclean/.github/.github/workflows/release.yaml@a7b7c24ac637a77cc5b4d1835ae3bccbd902ca48
    permissions: {}
    with:
      version: ${{ inputs.version }}
      assets: dist
