name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, without the v prefix (e.g. 1.2.0)'
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: duncanmcclean/.github/.github/workflows/release.yaml@cf61113f3bcbc7fb40ab88d094d2be7b8a474f50 # v1.0.0
    permissions: {}
    with:
      version: ${{ inputs.version }}
      assets: dist
