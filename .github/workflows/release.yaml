name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, without the v prefix (e.g. 1.2.0)'
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: duncanmcclean/.github/.github/workflows/release.yaml@3f08f281d0facb49b1a1f7ad5c94c58b3b2b61df
    permissions: {}
    with:
      version: ${{ inputs.version }}
      assets: dist
