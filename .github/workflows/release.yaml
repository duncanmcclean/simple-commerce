name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, without the v prefix (e.g. 1.2.0)'
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: duncanmcclean/.github/.github/workflows/release.yaml@b657c0da7472a6b46d4fbce61aab416d45f7f835
    permissions: {}
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    with:
      version: ${{ inputs.version }}
      assets: dist
