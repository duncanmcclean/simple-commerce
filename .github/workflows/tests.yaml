name: Test Suite

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php_tests:
    if: "!contains(github.event.head_commit.message, 'changelog')"

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      matrix:
        php: [8.3, 8.4, 8.5]
        laravel: [12.*, 13.*]
        stability: [prefer-lowest, prefer-stable]
        os: [ubuntu-latest]

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick

      - name: Install dependencies
        # zizmor: ignore[template-injection] - matrix values are defined in this file, not attacker-controlled
        run: |
          composer require "illuminate/contracts:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-suggest

      - name: Run PHPUnit
        run: vendor/bin/pest
        env:
          STRIPE_KEY: ${{ matrix.php == '8.5' && secrets.STRIPE_KEY || '' }}
          STRIPE_SECRET: ${{ matrix.php == '8.5' && secrets.STRIPE_SECRET || '' }}
          MOLLIE_KEY: ${{ matrix.php == '8.5' && secrets.MOLLIE_KEY || '' }}
          MOLLIE_PROFILE: ${{ matrix.php == '8.5' && secrets.MOLLIE_PROFILE || '' }}
