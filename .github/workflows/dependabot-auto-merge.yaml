name: Dependabot Auto Merge

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependabot:
    uses: duncanmcclean/.github/.github/workflows/dependabot-auto-merge.yaml@cf61113f3bcbc7fb40ab88d094d2be7b8a474f50 # v1.0.0
    permissions:
      contents: write # Merge the PR
      pull-requests: write # Merge the PR
