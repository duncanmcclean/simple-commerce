name: Dependabot Auto Merge

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependabot:
    uses: duncanmcclean/.github/.github/workflows/dependabot-auto-merge.yaml@3f08f281d0facb49b1a1f7ad5c94c58b3b2b61df
    permissions:
      contents: write # Merge the PR
      pull-requests: write # Merge the PR
