name: Dependabot Auto Merge

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependabot:
    uses: duncanmcclean/.github/.github/workflows/dependabot-auto-merge.yaml@bcdd4b7632e98497b7d2e251aff2222d0b5a181d
    permissions:
      contents: write # Merge the PR
      pull-requests: write # Merge the PR
