name: Dependabot Auto Merge

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependabot:
    uses: duncanmcclean/.github/.github/workflows/dependabot-auto-merge.yaml@21c725e83dc894f8876b10a6de09ea2077d45e25 # v1.0.1
    permissions:
      contents: write # Merge the PR
      pull-requests: write # Merge the PR
