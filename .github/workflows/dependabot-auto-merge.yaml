name: Dependabot Auto Merge

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependabot:
    uses: duncanmcclean/.github/.github/workflows/dependabot-auto-merge.yaml@0711e4ce063444dd01bd24d4226cbf866e08d273 # v1.0.2
    permissions:
      contents: write # Merge the PR
      pull-requests: write # Merge the PR
